<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조선 거북선 3D (Three.js)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: 'Malgun Gothic', sans-serif;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            pointer-events: none;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">조선 시대 거북선 (마우스로 드래그하여 회전/확대)</div>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. 기본 씬, 카메라, 렌더러 설정
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xdbe9f4);
        scene.fog = new THREE.FogExp2(0xdbe9f4, 0.008);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(35, 20, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // 2. 컨트롤 설정 (자동 회전 및 마우스 조작)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0; // 천천히 회전
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // 바다 밑으로 카메라가 내려가지 않게 제한
        controls.minDistance = 15;
        controls.maxDistance = 100;

        // 3. 조명 설정
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.5);
        dirLight.position.set(50, 80, 30);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 200;
        const d = 30;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // 4. 재질(Materials) 정의
        const darkWoodMat = new THREE.MeshStandardMaterial({ color: 0x3a2312, roughness: 0.9 });
        const midWoodMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.8 });
        const lightWoodMat = new THREE.MeshStandardMaterial({ color: 0x8c6239, roughness: 0.7 });
        const shellMat = new THREE.MeshStandardMaterial({ color: 0x2b302c, roughness: 0.6, metalness: 0.2 });
        const ironMat = new THREE.MeshStandardMaterial({ color: 0x778899, roughness: 0.3, metalness: 0.8 });
        const dragonMat = new THREE.MeshStandardMaterial({ color: 0x2e5a44, roughness: 0.5 }); // 청록색 단청 느낌
        const redMat = new THREE.MeshStandardMaterial({ color: 0xaa2222, roughness: 0.5 });
        const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.3, metalness: 0.6 });
        const sailMat = new THREE.MeshStandardMaterial({ color: 0xf4ebd9, roughness: 0.9, side: THREE.DoubleSide });

        // 5. 거북선 모델링 그룹 생성
        const turtleShip = new THREE.Group();
        scene.add(turtleShip);

        // 5-1. 하부 선체 (Hull)
        const hullGeo = new THREE.CylinderGeometry(6, 4, 24, 16);
        hullGeo.rotateX(Math.PI / 2);
        hullGeo.scale(1, 0.5, 1);
        const hull = new THREE.Mesh(hullGeo, darkWoodMat);
        hull.position.y = 0.5;
        hull.castShadow = true;
        hull.receiveShadow = true;
        turtleShip.add(hull);

        // 5-2. 상부 갑판 및 판옥 (중간 구조물)
        const deckGeo = new THREE.BoxGeometry(11, 2.5, 22);
        const deck = new THREE.Mesh(deckGeo, midWoodMat);
        deck.position.y = 2.5;
        deck.castShadow = true;
        deck.receiveShadow = true;
        turtleShip.add(deck);

        // 방패판 및 포구 (양옆)
        for (let z = -8; z <= 8; z += 3.2) {
            for (let side of [-1, 1]) {
                // 포구 구멍
                const portGeo = new THREE.BoxGeometry(0.5, 0.8, 0.8);
                const port = new THREE.Mesh(portGeo, new THREE.MeshBasicMaterial({color: 0x000000}));
                port.position.set(side * 5.4, 2.5, z);
                turtleShip.add(port);

                // 포신
                const cannonGeo = new THREE.CylinderGeometry(0.2, 0.25, 1.5, 8);
                cannonGeo.rotateZ(Math.PI / 2);
                const cannon = new THREE.Mesh(cannonGeo, ironMat);
                cannon.position.set(side * 5.6, 2.5, z);
                turtleShip.add(cannon);
            }
        }

        // 5-3. 등껍질 지붕 (Roof) & 쇠못 (Spikes)
        const roofGroup = new THREE.Group();
        turtleShip.add(roofGroup);

        // 구를 변형하여 거북선 등껍질 형태 제작
        const roofGeo = new THREE.SphereGeometry(6, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2);
        roofGeo.scale(1, 0.6, 2.1);
        const roof = new THREE.Mesh(roofGeo, shellMat);
        roof.position.y = 3.5;
        roof.castShadow = true;
        roof.receiveShadow = true;
        roofGroup.add(roof);

        // 등껍질 나무 판자 질감 표현 (테두리 링)
        for(let z = -10; z <= 10; z += 2.5) {
            const normalizedZ = z / 12.6;
            if(Math.abs(normalizedZ) < 1) {
                const archRadius = Math.sqrt(1 - normalizedZ * normalizedZ) * 6;
                const archGeo = new THREE.TorusGeometry(archRadius, 0.1, 4, 16, Math.PI);
                const arch = new THREE.Mesh(archGeo, darkWoodMat);
                arch.scale.set(1, 0.6, 1);
                arch.position.set(0, 3.5, z);
                roofGroup.add(arch);
            }
        }

        // 쇠못 (Spikes) 배치
        const spikeGeo = new THREE.ConeGeometry(0.12, 0.8, 4);
        for (let z = -11; z <= 11; z += 1.5) {
            for (let x = -5; x <= 5; x += 1.2) {
                // 타원 방정식을 이용해 지붕 표면 좌표 계산
                const nx = x / 6;
                const nz = z / 12.6;
                if (nx * nx + nz * nz <= 0.9) {
                    const ny = Math.sqrt(1 - nx * nx - nz * nz);
                    const y = ny * 3.6 + 3.5;

                    const spike = new THREE.Mesh(spikeGeo, ironMat);
                    spike.position.set(x, y, z);
                    
                    // 표면 법선 방향으로 쇠못 회전
                    const normal = new THREE.Vector3(nx/6, ny/3.6, nz/12.6).normalize();
                    spike.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
                    
                    spike.castShadow = true;
                    roofGroup.add(spike);
                }
            }
        }

        // 5-4. 용머리 (Dragon Head) - 선수(앞쪽, +Z 방향)
        const dragonGroup = new THREE.Group();
        dragonGroup.position.set(0, 4, 11);
        turtleShip.add(dragonGroup);

        // 목
        const neckGeo = new THREE.CylinderGeometry(1.2, 1.8, 5, 8);
        const neck = new THREE.Mesh(neckGeo, dragonMat);
        neck.rotation.x = Math.PI / 6;
        neck.position.set(0, 1.5, 1);
        neck.castShadow = true;
        dragonGroup.add(neck);

        // 머리 본체
        const headGeo = new THREE.BoxGeometry(2.8, 2.2, 3.5);
        const head = new THREE.Mesh(headGeo, dragonMat);
        head.position.set(0, 3.5, 2.5);
        head.castShadow = true;
        dragonGroup.add(head);

        // 입 (붉은색 내부 및 아래턱)
        const mouthGeo = new THREE.BoxGeometry(2.4, 1, 3);
        const mouth = new THREE.Mesh(mouthGeo, redMat);
        mouth.position.set(0, 2.8, 2.8);
        dragonGroup.add(mouth);

        // 입 속 대포 (현자총통)
        const dCannonGeo = new THREE.CylinderGeometry(0.4, 0.4, 2, 12);
        dCannonGeo.rotateX(Math.PI / 2);
        const dCannon = new THREE.Mesh(dCannonGeo, ironMat);
        dCannon.position.set(0, 3.0, 3.8);
        dragonGroup.add(dCannon);

        // 눈
        const eyeGeo = new THREE.SphereGeometry(0.4, 8, 8);
        for (let side of [-1, 1]) {
            const eye = new THREE.Mesh(eyeGeo, goldMat);
            eye.position.set(side * 1.4, 4.0, 3.2);
            dragonGroup.add(eye);
            
            // 뿔
            const hornGeo = new THREE.ConeGeometry(0.3, 2.5, 6);
            const horn = new THREE.Mesh(hornGeo, goldMat);
            horn.position.set(side * 1.0, 5.2, 1.5);
            horn.rotation.x = -Math.PI / 4;
            horn.rotation.z = side * -Math.PI / 8;
            dragonGroup.add(horn);

            // 송곳니
            const fangGeo = new THREE.ConeGeometry(0.15, 0.6, 4);
            const fang = new THREE.Mesh(fangGeo, sailMat);
            fang.rotation.x = Math.PI;
            fang.position.set(side * 1.0, 2.8, 4.0);
            dragonGroup.add(fang);
        }

        // 앞부분 도깨비 문양 방패 (선체 전면)
        const frontShieldGeo = new THREE.BoxGeometry(8, 2.5, 0.5);
        const frontShield = new THREE.Mesh(frontShieldGeo, redMat);
        frontShield.position.set(0, 2.5, 11.2);
        turtleShip.add(frontShield);

        // 5-5. 거북 꼬리 (Tail) - 선미(뒤쪽, -Z 방향)
        const tailGeo = new THREE.ConeGeometry(1.5, 6, 8);
        tailGeo.rotateX(-Math.PI / 2 - 0.2);
        const tail = new THREE.Mesh(tailGeo, darkWoodMat);
        tail.position.set(0, 3.5, -14);
        tail.castShadow = true;
        turtleShip.add(tail);

        // 5-6. 노 (Oars)
        const oars = [];
        for (let z = -7; z <= 7; z += 2.3) {
            for (let side of [-1, 1]) {
                const oarGroup = new THREE.Group();
                oarGroup.position.set(side * 5.2, 1.5, z);
                
                const poleGeo = new THREE.CylinderGeometry(0.1, 0.1, 6, 6);
                poleGeo.translate(0, -3, 0); // 회전축을 끝단으로 이동
                const pole = new THREE.Mesh(poleGeo, lightWoodMat);
                
                const bladeGeo = new THREE.BoxGeometry(0.4, 2, 0.1);
                bladeGeo.translate(0, -5.5, 0);
                const blade = new THREE.Mesh(bladeGeo, lightWoodMat);
                
                oarGroup.add(pole);
                oarGroup.add(blade);
                
                // 기본 각도 설정
                oarGroup.rotation.z = side * (Math.PI / 3);
                oarGroup.userData = { side: side, offset: z };
                
                turtleShip.add(oarGroup);
                oars.push(oarGroup);
            }
        }

        // 5-7. 돛과 돛대 (Masts and Sails) - 한선 특유의 대나무 살이 있는 사각형 돛
        function createSail(zPos, scale) {
            const mastGroup = new THREE.Group();
            mastGroup.position.set(0, 4, zPos);
            mastGroup.scale.set(scale, scale, scale);

            // 돛대
            const mastGeo = new THREE.CylinderGeometry(0.25, 0.35, 16, 8);
            mastGeo.translate(0, 8, 0);
            const mast = new THREE.Mesh(mastGeo, midWoodMat);
            mast.castShadow = true;
            mastGroup.add(mast);

            // 돛 (천)
            const sailGeo = new THREE.PlaneGeometry(8, 10, 8, 8);
            // 바람에 부푼 형태 변형
            const pos = sailGeo.attributes.position;
            for(let i=0; i<pos.count; i++){
                const x = pos.getX(i);
                const y = pos.getY(i);
                const z = Math.cos(x / 4 * (Math.PI/2)) * Math.cos(y / 5 * (Math.PI/2)) * 1.2;
                pos.setZ(i, z);
            }
            sailGeo.computeVertexNormals();

            const sail = new THREE.Mesh(sailGeo, sailMat);
            sail.position.set(0, 9, 0.3);
            sail.castShadow = true;
            mastGroup.add(sail);

            // 돛의 대나무 살 (가로대)
            for(let y = 4; y <= 14; y += 2) {
                const ribGeo = new THREE.CylinderGeometry(0.08, 0.08, 8.2, 6);
                ribGeo.rotateZ(Math.PI / 2);
                const rib = new THREE.Mesh(ribGeo, lightWoodMat);
                // 부푼 정도에 맞춰 위치 조정
                const zOffset = Math.cos((y-9) / 5 * (Math.PI/2)) * 1.2;
                rib.position.set(0, y, 0.3 + zOffset * 0.5);
                mastGroup.add(rib);
            }

            return mastGroup;
        }

        turtleShip.add(createSail(2, 1.0));   // 주 돛대
        turtleShip.add(createSail(-5, 0.75)); // 보조 돛대

        // 5-8. 깃발 (전통 삼각 깃발)
        const flagPoleGeo = new THREE.CylinderGeometry(0.08, 0.1, 6);
        const flagPole = new THREE.Mesh(flagPoleGeo, lightWoodMat);
        flagPole.position.set(0, 7, -11);
        turtleShip.add(flagPole);

        const flagGeo = new THREE.BufferGeometry();
        const flagVertices = new Float32Array([
            0, 10, -11,
            0, 7.5, -11,
            0, 8.75, -15
        ]);
        flagGeo.setAttribute('position', new THREE.BufferAttribute(flagVertices, 3));
        flagGeo.computeVertexNormals();
        const flagMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, side: THREE.DoubleSide });
        const flag = new THREE.Mesh(flagGeo, flagMat);
        turtleShip.add(flag);


        // 6. 바다(Water) 생성
        const waterGeo = new THREE.PlaneGeometry(300, 300, 128, 128);
        waterGeo.rotateX(-Math.PI / 2);
        
        const waterMat = new THREE.MeshStandardMaterial({
            color: 0x005577,
            roughness: 0.1,
            metalness: 0.6,
            flatShading: true
        });
        
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.receiveShadow = true;
        scene.add(water);

        // 파도 애니메이션을 위한 초기 정점 저장
        const waterPos = waterGeo.attributes.position;
        const initialWaterY = [];
        for (let i = 0; i < waterPos.count; i++) {
            initialWaterY.push(waterPos.getY(i));
        }

        // 7. 애니메이션 루프
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            // 7-1. 바다 물결 애니메이션
            for (let i = 0; i < waterPos.count; i++) {
                const x = waterPos.getX(i);
                const z = waterPos.getZ(i);
                const wave1 = Math.sin(x * 0.15 + time * 2.0) * 0.4;
                const wave2 = Math.cos(z * 0.1 + time * 1.5) * 0.4;
                const wave3 = Math.sin((x + z) * 0.05 + time * 1.0) * 0.6;
                waterPos.setY(i, initialWaterY[i] + wave1 + wave2 + wave3);
            }
            waterGeo.attributes.position.needsUpdate = true;
            waterGeo.computeVertexNormals();

            // 7-2. 거북선 흔들림 (부유 효과)
            turtleShip.position.y = Math.sin(time * 2) * 0.2 - 0.5;
            turtleShip.rotation.x = Math.sin(time * 1.5) * 0.03;
            turtleShip.rotation.z = Math.cos(time * 1.2) * 0.04;

            // 7-3. 노 젓기 애니메이션
            oars.forEach(oar => {
                const side = oar.userData.side;
                const offset = oar.userData.offset;
                oar.rotation.x = Math.sin(time * 3 + offset * 0.5) * 0.3;
                oar.rotation.z = side * (Math.PI / 3 + Math.cos(time * 3 + offset * 0.5) * 0.15);
            });

            // 7-4. 깃발 나부낌
            const flagPos = flag.geometry.attributes.position;
            flagPos.setX(2, Math.sin(time * 10) * 0.5);
            flagPos.needsUpdate = true;

            // 컨트롤 업데이트 (자동 회전 포함)
            controls.update();

            renderer.render(scene, camera);
        }

        // 8. 반응형 창 크기 조절
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
