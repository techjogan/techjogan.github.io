<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>테크조간 자료실</title>
<meta name="description" content="테크조간 영상에서 드린다고 한 자료를 모아 둔 곳입니다.">
<meta property="og:title" content="테크조간 자료실">
<meta property="og:description" content="테크조간 영상에서 드린다고 한 자료를 모아 둔 곳입니다.">
<meta property="og:image" content="https://techjogan.github.io/wordmark.png">
<meta name="theme-color" content="#111111">
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: brand-dark single column; the wordmark leads, hairlines separate entries, orange only on the primary action and small labels */
:root {
  --bg:#111111; --panel:#1a1a1a; --line:#2a2a2a; --text:#f2f2f0; --sub:#c9ccd2; --dim:#8b8e94; --orange:#e26a14; --orange-hi:#f37d2b;
  --sans:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,"Pretendard Variable",monospace;
  color-scheme:dark;
}
* { box-sizing:border-box; }
html { background:var(--bg); }
body { margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:16px; line-height:1.7; letter-spacing:-0.01em; word-break:keep-all; overflow-wrap:anywhere;
  padding-left:max(20px, env(safe-area-inset-left, 0px)); padding-right:max(20px, env(safe-area-inset-right, 0px)); padding-block:max(20px, env(safe-area-inset-top, 0px)) 72px; -webkit-font-smoothing:antialiased; }
a { color:inherit; }
.wrap { max-width:47rem; margin:0 auto; }
.top { display:flex; align-items:center; justify-content:space-between; padding-block:8px 36px; }
.top img { height:22px; width:auto; display:block; }
.top span { font-size:13px; color:var(--dim); }
.label { font-family:var(--mono); font-size:12.5px; color:var(--dim); letter-spacing:0; font-variant-numeric:tabular-nums; }
h1 { font-size:clamp(30px, 6.6vw, 46px); line-height:1.18; font-weight:800; letter-spacing:-0.04em; margin:10px 0 0; text-wrap:balance; }
.lead { color:var(--sub); margin:16px 0 0; max-width:38em; }
.stats { display:flex; flex-wrap:wrap; margin:28px 0 0; padding:0; list-style:none; }
.stats li { padding-right:22px; margin-right:22px; border-right:1px solid var(--line); }
.stats li:last-child { border-right:0; margin-right:0; padding-right:0; }
.stats b { font-size:26px; font-weight:700; letter-spacing:-0.03em; font-variant-numeric:tabular-nums; }
.stats small { font-size:13.5px; color:var(--dim); margin-left:4px; }
.sec-title { font-size:13px; font-weight:700; color:var(--orange); margin:0 0 6px; }
.how { margin:44px 0 0; }
.how dl { margin:0; }
.how .row { display:grid; grid-template-columns:7.5em minmax(0, 1fr); gap:16px; padding:14px 0; border-top:1px solid var(--line); }
.how dt { font-weight:700; }
.how dd { margin:0; color:var(--sub); }
.items { margin:52px 0 0; }
.item { display:grid; grid-template-columns:15rem minmax(0, 1fr); gap:28px; padding:32px 0; border-top:1px solid var(--line); }
.shot { border-radius:10px; overflow:hidden; background:#000; aspect-ratio:4 / 3; max-width:100%; }
.shot img { width:100%; height:100%; object-fit:cover; display:block; }
.shot.empty { display:flex; align-items:flex-end; padding:16px; background:var(--panel); border:1px solid var(--line); }
.shot.empty p { margin:0; font-size:14px; color:var(--dim); line-height:1.5; }
.shot.empty p::after { content:""; display:inline-block; width:0.5em; height:0.12em; background:var(--orange); margin-left:4px; }
.body { display:grid; gap:12px; align-content:start; min-width:0; }
.kind { font-family:var(--mono); font-size:12px; color:var(--orange); letter-spacing:0; }
h2 { font-size:23px; line-height:1.3; font-weight:700; letter-spacing:-0.03em; margin:-4px 0 0; text-wrap:balance; }
.what { margin:0; color:var(--sub); }
.meta { margin:0; font-family:var(--mono); font-size:12.5px; color:var(--dim); font-variant-numeric:tabular-nums; letter-spacing:0; }
.check { margin:0; font-size:14.5px; color:var(--sub); padding-left:12px; border-left:2px solid var(--orange); }
.check b { color:var(--text); font-weight:700; margin-right:6px; }
.actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:2px; }
.btn { display:inline-flex; align-items:center; gap:6px; font-size:15px; font-weight:700; text-decoration:none; padding:10px 16px; border-radius:8px; border:1px solid var(--line); color:var(--text); background:transparent; transition:border-color .15s, background .15s; }
.btn.primary { background:var(--orange); border-color:var(--orange); color:#111; }
.btn.primary:hover { background:var(--orange-hi); border-color:var(--orange-hi); }
.btn:hover { border-color:var(--sub); }
.btn:focus-visible, .copy:focus-visible, summary:focus-visible, .kit:focus-visible, .top a:focus-visible { outline:2px solid var(--orange); outline-offset:3px; }
.prompt { background:var(--panel); border-radius:10px; overflow:hidden; min-width:0; }
.prompt-head { display:flex; justify-content:space-between; align-items:center; padding:8px 8px 8px 14px; font-size:13px; color:var(--dim); border-bottom:1px solid var(--line); }
.prompt-head a { color:var(--orange); }
.copy { font:inherit; font-size:13px; font-weight:700; color:var(--text); background:#262626; border:0; border-radius:6px; padding:4px 12px; cursor:pointer; }
.copy:hover { background:#303030; }
.prompt pre { margin:0; padding:14px; font-family:var(--sans); font-size:14.5px; line-height:1.65; color:var(--sub); white-space:pre-wrap; max-height:15rem; overflow:auto; }
.prompt pre.code, details pre { font-family:var(--mono); font-size:13px; line-height:1.6; letter-spacing:0; }
details { background:var(--panel); border-radius:10px; overflow:hidden; }
summary { cursor:pointer; padding:10px 14px; font-weight:700; font-size:14.5px; list-style:none; display:flex; justify-content:space-between; }
summary::-webkit-details-marker { display:none; }
summary::after { content:"+"; color:var(--dim); font-weight:400; }
details[open] summary::after { content:"−"; }
details pre { margin:0; padding:14px; color:var(--sub); white-space:pre-wrap; max-height:30rem; overflow:auto; border-top:1px solid var(--line); }
footer { margin-top:56px; padding-top:24px; border-top:1px solid var(--line); display:grid; gap:6px; font-size:13.5px; color:var(--dim); }
footer img { height:18px; width:auto; margin-bottom:8px; }
.hub-head { padding-block:24px 8px; }
.hub-head img { height:48px; width:auto; display:block; }
.tagline { margin:18px 0 0; font-size:20px; font-weight:700; line-height:1.35; letter-spacing:-0.02em; }
.tagline span { color:var(--sub); } .tagline em { font-style:normal; color:var(--orange); }
.kits { margin:44px 0 0; }
.kit { display:grid; grid-template-columns:6.5rem minmax(0, 1fr); gap:18px; align-items:center; padding:20px 0; border-top:1px solid var(--line); text-decoration:none; }
.kit img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; display:block; }
.kit h2 { font-size:20px; margin:4px 0 0; }
.kit p { margin:4px 0 0; color:var(--sub); font-size:15px; }
.kit:hover h2 { color:var(--orange); }
@media (max-width: 680px) {
  .item { grid-template-columns:1fr; gap:18px; padding:28px 0; }
  .shot { aspect-ratio:16 / 10; }
  .how .row { grid-template-columns:1fr; gap:2px; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body><div class="wrap">
<div class="hub-head"><img src="wordmark.png" alt="테크조간"><p class="tagline"><span>혁신?</span><br><em>일단 의심</em></p></div>
<p class="lead">영상에서 드린다고 한 자료를 여기 모읍니다. 전부 직접 돌려 보고 확인한 것만 올립니다.</p>

<footer>
  <img src="wordmark.png" alt="테크조간">
  <span>혁신? 일단 의심. 직접 돌려 보고 확인한 것만 올립니다.</span>
  <span><a href="https://www.youtube.com/@테크조간">youtube.com/@테크조간</a></span>
  
</footer>
</div></body></html>
