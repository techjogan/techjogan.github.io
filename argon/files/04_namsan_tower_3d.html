<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울의 밤 - 남산서울타워 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #02040a;
            font-family: 'Malgun Gothic', sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: rgba(255, 255, 255, 0.8);
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 150, 255, 0.8);
        }
        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        p {
            margin: 5px 0 0 0;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <h1>N SEOUL TOWER</h1>
        <p>마우스를 드래그하여 시점을 조절하세요 (스크롤: 줌)</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // 1. 씬, 카메라, 렌더러 설정
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x02040a);
        scene.fog = new THREE.FogExp2(0x02040a, 0.0012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 3000);
        camera.position.set(180, 160, 220);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);

        // 2. 포스트 프로세싱 (Bloom 효과로 야경 빛 번짐 구현)
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.2;
        bloomPass.strength = 1.4; // 빛 번짐 강도
        bloomPass.radius = 0.6;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // 3. 컨트롤 설정
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 110, 0); // 타워 중심을 바라봄
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.6;
        controls.maxPolarAngle = Math.PI / 2 - 0.02; // 땅 아래로 내려가지 않게
        controls.minDistance = 50;
        controls.maxDistance = 800;

        // 4. 조명
        const ambientLight = new THREE.AmbientLight(0x101830, 2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x4466aa, 1);
        dirLight.position.set(200, 400, 200);
        scene.add(dirLight);

        // 5. 지형 및 한강 생성
        function getRiverX(z) {
            return Math.sin(z * 0.004) * 200 - 150;
        }
        const riverWidth = 140;

        // 5-1. 남산 (타워가 올라갈 산)
        const mountainGeo = new THREE.PlaneGeometry(2400, 2400, 256, 256);
        mountainGeo.rotateX(-Math.PI / 2);
        const pos = mountainGeo.attributes.position;
        
        for (let i = 0; i < pos.count; i++) {
            let x = pos.getX(i);
            let z = pos.getZ(i);
            let dist = Math.sqrt(x * x + z * z);

            // 남산의 봉우리 형태 계산 (가우시안 함수 응용)
            let y = 0;
            if (dist < 350) {
                y = 85 * Math.exp(-(dist * dist) / 18000);
                // 자연스러운 굴곡 추가
                y += Math.sin(x * 0.05) * Math.cos(z * 0.05) * 3 * (1 - dist/350);
            }
            
            // 한강 영역은 땅을 파서 물이 보이게 함
            let rx = getRiverX(z);
            if (Math.abs(x - rx) < riverWidth) {
                y = -3;
            }
            pos.setY(i, y);
        }
        mountainGeo.computeVertexNormals();

        const mountainMat = new THREE.MeshStandardMaterial({
            color: 0x050a07,
            roughness: 0.9,
            metalness: 0.1
        });
        const mountain = new THREE.Mesh(mountainGeo, mountainMat);
        scene.add(mountain);

        // 5-2. 한강 물결
        const waterGeo = new THREE.PlaneGeometry(2400, 2400);
        waterGeo.rotateX(-Math.PI / 2);
        const waterMat = new THREE.MeshStandardMaterial({
            color: 0x020612,
            roughness: 0.1,
            metalness: 0.8
        });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.position.y = -1;
        scene.add(water);

        // 6. 남산서울타워 (N서울타워) 모델링
        const towerGroup = new THREE.Group();
        const namsanHeight = 85;
        towerGroup.position.set(0, namsanHeight - 2, 0);

        // 재질들
        const concreteMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.6 });
        const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.4, metalness: 0.8 });
        
        // 공기질 좋음(파란색)을 상징하는 타워 조명
        const glowBlueMat = new THREE.MeshStandardMaterial({ 
            color: 0x0088ff, emissive: 0x0055ff, emissiveIntensity: 1.5, roughness: 0.3 
        });
        const glowCyanMat = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, emissive: 0x00ffff, emissiveIntensity: 2.5 
        });
        const glowWarmMat = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, emissive: 0xffaa44, emissiveIntensity: 2.0 
        });
        const redBeaconMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });

        // 기단부 (플라자)
        const base1 = new THREE.Mesh(new THREE.BoxGeometry(24, 6, 16), darkMetalMat);
        base1.position.y = 3;
        towerGroup.add(base1);
        
        const base2 = new THREE.Mesh(new THREE.CylinderGeometry(8, 10, 6, 16), concreteMat);
        base2.position.y = 9;
        towerGroup.add(base2);

        // 타워 기둥 (하단부는 일반, 상단부는 블루 라이트업)
        const shaftLower = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.8, 30, 32), concreteMat);
        shaftLower.position.y = 27;
        towerGroup.add(shaftLower);

        const shaftUpper = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 3.2, 35, 32), glowBlueMat);
        shaftUpper.position.y = 59.5;
        towerGroup.add(shaftUpper);

        // 기둥 세로 네온 라인
        for(let i = 0; i < 4; i++) {
            const line = new THREE.Mesh(new THREE.BoxGeometry(0.3, 60, 0.3), glowCyanMat);
            const angle = (i * Math.PI) / 2;
            line.position.set(Math.cos(angle)*3.1, 45, Math.sin(angle)*3.1);
            towerGroup.add(line);
        }

        // 전망대 하단 구조물
        const podBase = new THREE.Mesh(new THREE.CylinderGeometry(7, 3, 4, 32), darkMetalMat);
        podBase.position.y = 78;
        towerGroup.add(podBase);

        // 메인 전망대 (빛나는 창문 링 포함)
        const podMain = new THREE.Mesh(new THREE.CylinderGeometry(7.5, 7.5, 8, 32), darkMetalMat);
        podMain.position.y = 84;
        towerGroup.add(podMain);

        const windowRing1 = new THREE.Mesh(new THREE.CylinderGeometry(7.6, 7.6, 2.5, 32), glowCyanMat);
        windowRing1.position.y = 82.5;
        towerGroup.add(windowRing1);

        const windowRing2 = new THREE.Mesh(new THREE.CylinderGeometry(7.6, 7.6, 2, 32), glowWarmMat);
        windowRing2.position.y = 86;
        towerGroup.add(windowRing2);

        // 상부 회전 레스토랑 층
        const podTop = new THREE.Mesh(new THREE.CylinderGeometry(5, 6.5, 5, 32), darkMetalMat);
        podTop.position.y = 90.5;
        towerGroup.add(podTop);

        const windowRing3 = new THREE.Mesh(new THREE.CylinderGeometry(5.8, 6.2, 2, 32), glowWarmMat);
        windowRing3.position.y = 90.5;
        towerGroup.add(windowRing3);

        // 송신탑 (안테나)
        const antenna1 = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 2.0, 20, 16), glowBlueMat);
        antenna1.position.y = 103;
        towerGroup.add(antenna1);

        const antenna2 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 1.0, 25, 16), glowCyanMat);
        antenna2.position.y = 125.5;
        towerGroup.add(antenna2);

        // 안테나 철골 디테일 링
        for(let y = 98; y < 130; y += 6) {
            const r = y < 113 ? 1.8 : 0.8;
            const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.15, 8, 24), darkMetalMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = y;
            towerGroup.add(ring);
        }

        // 항공장애등 (꼭대기 빨간 불빛)
        const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), redBeaconMat);
        beacon.position.y = 138;
        towerGroup.add(beacon);

        // 타워 자체 발광을 위한 포인트 라이트
        const towerLight = new THREE.PointLight(0x0088ff, 5, 150);
        towerLight.position.set(0, 70, 0);
        towerGroup.add(towerLight);

        scene.add(towerGroup);

        // 7. 서울 도심 빌딩 숲 (InstancedMesh로 수만 개의 빌딩과 불빛 렌더링)
        
        // 빌딩 창문 텍스처 프로시저럴 생성 (캔버스 활용)
        function createBuildingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, 64, 128);
            
            for (let y = 4; y < 124; y += 6) {
                for (let x = 4; x < 60; x += 6) {
                    if (Math.random() > 0.45) { // 불 켜진 방 확률
                        const rand = Math.random();
                        // 다양한 색온도의 사무실/집 불빛
                        if (rand > 0.8) ctx.fillStyle = '#aaddff';
                        else if (rand > 0.3) ctx.fillStyle = '#ffddaa';
                        else ctx.fillStyle = '#ffffff';
                        
                        ctx.fillRect(x, y, 3, 3);
                    }
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        const buildingTexture = createBuildingTexture();
        const buildingGeo = new THREE.BoxGeometry(1, 1, 1);
        // 박스의 기준점을 바닥으로 이동
        buildingGeo.translate(0, 0.5, 0); 

        const buildingMat = new THREE.MeshStandardMaterial({
            color: 0x111118,
            roughness: 0.8,
            emissive: 0xffffff,
            emissiveMap: buildingTexture,
            emissiveIntensity: 1.2
        });

        const buildingCount = 12000;
        const buildings = new THREE.InstancedMesh(buildingGeo, buildingMat, buildingCount);
        
        const dummy = new THREE.Object3D();
        let index = 0;

        for (let i = 0; i < buildingCount * 1.5; i++) {
            if (index >= buildingCount) break;

            // 도시 범위 내 랜덤 위치
            const angle = Math.random() * Math.PI * 2;
            // 중심부에 더 밀집되도록 거리 계산
            const radius = 220 + Math.pow(Math.random(), 1.5) * 900; 
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;

            // 남산 영역 제외
            if (x * x + z * z < 230 * 230) continue;

            // 한강 영역 제외
            const rx = getRiverX(z);
            if (Math.abs(x - rx) < riverWidth + 15) continue;

            // 빌딩 크기 및 높이 설정 (거리에 따라 고층빌딩 군집 형성)
            const isCluster = (Math.sin(x * 0.01) + Math.cos(z * 0.01)) > 0.8;
            const width = 4 + Math.random() * 8;
            const depth = 4 + Math.random() * 8;
            let height = 5 + Math.pow(Math.random(), 3) * (isCluster ? 75 : 30);

            dummy.position.set(x, 0, z);
            dummy.scale.set(width, height, depth);
            dummy.rotation.y = Math.random() * Math.PI;
            dummy.updateMatrix();

            buildings.setMatrixAt(index++, dummy.matrix);
        }
        scene.add(buildings);

        // 8. 도로망, 차량 불빛, 한강 다리 (Points 활용)
        const lightPositions = [];
        const lightColors = [];
        const colorPalette = [
            new THREE.Color(0xffaa00), // 가로등 (주황)
            new THREE.Color(0xff2200), // 차량 후미등 (빨강)
            new THREE.Color(0xffffff), // 차량 전조등 (흰색)
            new THREE.Color(0x00ffff)  // 네온사인 (청록)
        ];

        // 8-1. 도심 도로 불빛
        for (let i = 0; i < 35000; i++) {
            const r = 180 + Math.random() * 1000;
            const theta = Math.random() * Math.PI * 2;
            const x = Math.cos(theta) * r;
            const z = Math.sin(theta) * r;

            const rx = getRiverX(z);
            if (Math.abs(x - rx) < riverWidth + 5) continue;
            if (x * x + z * z < 200 * 200) continue; // 남산 내부 제외

            // 격자형 도로망 느낌을 위해 좌표 보정
            let px = x, pz = z;
            if (Math.random() > 0.3) {
                px = Math.round(x / 40) * 40 + (Math.random() - 0.5) * 4;
            } else {
                pz = Math.round(z / 40) * 40 + (Math.random() - 0.5) * 4;
            }

            lightPositions.push(px, 1.0, pz);
            
            const c = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            lightColors.push(c.r, c.g, c.b);
        }

        // 8-2. 남산 소월로/산책로 가로등 (산을 따라 올라가는 구불구불한 빛)
        for (let i = 0; i < 400; i++) {
            const t = i / 400;
            const angle = t * Math.PI * 6;
            const r = 210 - t * 180;
            const x = Math.cos(angle) * r;
            const z = Math.sin(angle) * r;
            const dist = Math.sqrt(x * x + z * z);
            const y = 85 * Math.exp(-(dist * dist) / 18000) + 1.5;

            lightPositions.push(x, y, z);
            const c = colorPalette[0]; // 따뜻한 가로등 색
            lightColors.push(c.r, c.g, c.b);
        }

        // 8-3. 한강 대교 불빛
        for (let z = -900; z <= 900; z += 180) {
            const rx = getRiverX(z);
            let step = 0;
            for (let x = rx - riverWidth - 20; x <= rx + riverWidth + 20; x += 3) {
                // 다리 양쪽 차선 및 현수교 케이블 표현
                const distFromCenter = Math.abs(x - rx);
                const archY = Math.cos((distFromCenter / riverWidth) * (Math.PI / 2)) * 12;

                // 도로면 불빛
                lightPositions.push(x, 2, z - 3);
                lightColors.push(1.0, 0.7, 0.2);
                lightPositions.push(x, 2, z + 3);
                lightColors.push(1.0, 0.2, 0.1);

                // 아치 구조물 불빛 (오류 수정됨: i 대신 step 사용)
                if (archY > 0 && step % 2 === 0) {
                    lightPositions.push(x, 2 + archY, z);
                    lightColors.push(0.2, 0.6, 1.0); // 파란색 교량 조명
                }
                step++;
            }
        }

        const cityLightsGeo = new THREE.BufferGeometry();
        cityLightsGeo.setAttribute('position', new THREE.Float32BufferAttribute(lightPositions, 3));
        cityLightsGeo.setAttribute('color', new THREE.Float32BufferAttribute(lightColors, 3));

        // 둥근 빛 입자 텍스처
        const dotCanvas = document.createElement('canvas');
        dotCanvas.width = 16; dotCanvas.height = 16;
        const dotCtx = dotCanvas.getContext('2d');
        const grad = dotCtx.createRadialGradient(8, 8, 0, 8, 8, 8);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        dotCtx.fillStyle = grad;
        dotCtx.fillRect(0, 0, 16, 16);
        const dotTexture = new THREE.CanvasTexture(dotCanvas);

        const cityLightsMat = new THREE.PointsMaterial({
            size: 4,
            vertexColors: true,
            map: dotTexture,
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false
        });

        const cityLights = new THREE.Points(cityLightsGeo, cityLightsMat);
        scene.add(cityLights);

        // 9. 밤하늘의 별
        const starPositions = [];
        const starColors = [];
        for (let i = 0; i < 3000; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(Math.random()); // 지평선 위쪽만(반구)
            const r = 1200 + Math.random() * 300;

            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.cos(phi) + 50; // 약간 위로 올림
            const z = r * Math.sin(phi) * Math.sin(theta);

            starPositions.push(x, y, z);
            const intensity = 0.3 + Math.random() * 0.7;
            starColors.push(intensity, intensity, intensity + Math.random()*0.2);
        }

        const starsGeo = new THREE.BufferGeometry();
        starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
        starsGeo.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));

        const starsMat = new THREE.PointsMaterial({
            size: 2.5,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            fog: false // 별은 안개 영향을 받지 않도록 설정
        });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        // 10. 애니메이션 및 반응형 처리
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // 카메라 자동 회전 및 컨트롤 업데이트
            controls.update();

            // 타워 꼭대기 빨간 불빛 깜빡임 효과
            const beaconIntensity = (Math.sin(elapsedTime * 5) + 1) * 0.5;
            redBeaconMat.color.setRGB(0.2 + beaconIntensity * 2.0, 0, 0);

            // 별빛 은은하게 반짝임 (회전 이용)
            stars.rotation.y = elapsedTime * 0.005;

            // Bloom이 적용된 컴포저로 렌더링
            composer.render();
        }

        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();

            renderer.setSize(width, height);
            composer.setSize(width, height);
        });

        animate();
    </script>
</body>
</html>
